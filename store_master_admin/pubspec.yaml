name: store_master_license_manager

description: برنامه مستقل صدور و مدیریت لایسنس Store Master

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cryptography: ^2.9.0
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^10.3.8

  video_player: ^2.14.0
  video_player_win: ^3.2.2

  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2

  intl: ^0.20.2

  shared:
    path: ../shared

  excel: ^4.0.6
  pdf: ^3.12.0

  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

#  flutter_native_splash: ^2.4.4
#  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/videos/splash.mp4
    - assets/videos/splash_windows.mp4
