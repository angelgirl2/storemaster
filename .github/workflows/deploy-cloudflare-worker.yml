name: Deploy Store Master Cloudflare failover Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Worker JavaScript
        run: node --check cloudflare/src/index.js

      - name: Check deployment configuration
        env:
          PRIMARY_API_ORIGIN: ${{ vars.PRIMARY_API_ORIGIN }}
          FALLBACK_API_ORIGIN: ${{ vars.FALLBACK_API_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAILOVER_CONTROL_KEY: ${{ secrets.FAILOVER_CONTROL_KEY }}
        run: |
          test -n "$PRIMARY_API_ORIGIN" || { echo 'Set repository variable PRIMARY_API_ORIGIN'; exit 1; }
          test -n "$FALLBACK_API_ORIGIN" || { echo 'Set repository variable FALLBACK_API_ORIGIN'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test ${#FAILOVER_CONTROL_KEY} -ge 32 || { echo 'Set FAILOVER_CONTROL_KEY secret (at least 32 characters)'; exit 1; }

      - name: Test Worker routing and failover safeguards
        run: npm --prefix cloudflare test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        env:
          FAILOVER_CONTROL_KEY: ${{ secrets.FAILOVER_CONTROL_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml --var PRIMARY_API_ORIGIN:${{ vars.PRIMARY_API_ORIGIN }} --var FALLBACK_API_ORIGIN:${{ vars.FALLBACK_API_ORIGIN }}
          secrets: |
            FAILOVER_CONTROL_KEY
