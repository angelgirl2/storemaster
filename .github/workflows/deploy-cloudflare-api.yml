name: Deploy Store Master API to Cloudflare (D1 + R2)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-api/**'
      - '.github/workflows/deploy-cloudflare-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storemaster-cloudflare-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-api/package.json

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript and tests
        run: |
          npm run check
          npm test

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test "${#JWT_KEY}" -ge 32 || { echo 'JWT_KEY must be at least 32 characters'; exit 1; }
          test "${#ADMIN_KEY}" -ge 32 || { echo 'ADMIN_KEY must be at least 32 characters'; exit 1; }

      - name: Create D1 and R2 resources if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision.mjs

      - name: Apply D1 schema migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply storemaster-prod --remote --config wrangler.toml

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

      - name: Set runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          printf '%s' "$JWT_KEY" | npx wrangler secret put JWT_KEY --config wrangler.toml
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY --config wrangler.toml

      - name: Optional smoke test
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if [ -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" ]; then
            curl --fail --silent --show-error "https://storemaster-api.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev/health"
          else
            echo 'Worker deployed. Add optional repository variable CLOUDFLARE_WORKERS_SUBDOMAIN to run an automatic HTTP smoke test.'
          fi
